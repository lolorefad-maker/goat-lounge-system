# Render Blueprint: GOAT Gaming Center Lounge System
services:
  - type: web
    name: goat-lounge
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: export NODE_OPTIONS="--max-old-space-size=384" && npm ci --prefer-offline --no-audit --no-fund && npm run build -w @lounge/web
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=384"
      - key: LOUNGE_MODE
        value: cloud
      - key: DATABASE_URL
        fromDatabase:
          name: goat-lounge-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: LOUNGE_ACCESS_CODE
        sync: false
      - key: LOUNGE_OWNER_PIN
        sync: false
      - key: LOUNGE_OWNER_NAME
        sync: false

databases:
  - name: goat-lounge-db
    databaseName: goatlounge
    user: goat
    region: frankfurt
    plan: free
